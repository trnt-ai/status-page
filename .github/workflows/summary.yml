#
# ===============================
# SEC-44: de-templated — safe to edit
# ===============================
#
# Upstream Upptime auto-regeneration (update-template / updates / setup) was
# removed for SEC-44, so this file is no longer overwritten. It is now
# maintained by hand: it runs on the scoped GITHUB_TOKEN with least-privilege
# permissions (below) and SHA-pinned actions. To move to a newer Upptime
# version, follow the manual-update steps in the PR / runbook.
#
# 🔼 Upptime @v1.42.6 — https://upptime.js.org · by Anand Chowdhary

name: Summary CI
on:
  schedule:
    - cron: "0 0 * * *"
  repository_dispatch:
    types: [summary]
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
permissions:
  contents: write # commit README summary table
jobs:
  release:
    name: Generate README
    runs-on: ubuntu-latest
    steps:
      # Mint a short-lived, repo-scoped installation token for the dedicated
      # `trent-ai-upptime-bot` GitHub App. This identity is the sole bypass actor on
      # the branch ruleset, so the bot's direct-to-default-branch commits are
      # allowed while humans + Dependabot still require a reviewed PR. The token
      # auto-expires (~1h); the App private key is the only stored secret.
      - name: Generate Upptime app token
        id: app-token
        uses: actions/create-github-app-token@bcd2ba49218906704ab6c1aa796996da409d3eb1 # v3.2.0
        with:
          app-id: ${{ secrets.UPPTIME_APP_ID }}
          private-key: ${{ secrets.UPPTIME_APP_PRIVATE_KEY }}
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ steps.app-token.outputs.token }}
      - name: Update summary in README
        uses: upptime/uptime-monitor@7d817ff35938c9c706acb7c86ed8d52e22cae2b7 # v1.43.10
        with:
          command: "readme"
        env:
          GH_PAT: ${{ steps.app-token.outputs.token }}
