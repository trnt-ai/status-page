#
# ===============================
# SEC-44: de-templated — safe to edit
# ===============================
#
# Upstream Upptime auto-regeneration (update-template / updates / setup) was
# removed for SEC-44, so this file is no longer overwritten. It is now
# maintained by hand: it runs on the scoped GITHUB_TOKEN with least-privilege
# permissions (below) and SHA-pinned actions. To move to a newer Upptime
# version, follow the manual-update steps in the PR / runbook.
#
# 🔼 Upptime @v1.42.6 — https://upptime.js.org · by Anand Chowdhary

name: Static Site CI
on:
  push:
    paths:
      - "assets/**"
  schedule:
    - cron: "0 1 * * *"
  repository_dispatch:
    types: [static_site]
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
permissions:
  contents: write # build + push the static site to the gh-pages branch
jobs:
  release:
    name: Build and deploy site
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ github.token }}
      - name: Generate site
        uses: upptime/uptime-monitor@74c4eec4ce03f9746075cdca36971c1956b5e607 # v1.42.7
        with:
          command: "site"
        env:
          GH_PAT: ${{ github.token }}
      - uses: peaceiris/actions-gh-pages@84c30a85c19949d7eee79c4ff27748b70285e453 # v4
        name: GitHub Pages Deploy
        with:
          github_token: ${{ github.token }}
          publish_dir: "site/status-page/__sapper__/export/"
          force_orphan: "false"
          user_name: "Upptime Bot"
          user_email: "73812536+upptime-bot@users.noreply.github.com"
