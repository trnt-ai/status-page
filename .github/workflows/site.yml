#
# ===============================
# SEC-44: de-templated — safe to edit
# ===============================
#
# Upstream Upptime auto-regeneration (update-template / updates / setup) was
# removed for SEC-44, so this file is no longer overwritten. It is now
# maintained by hand: it runs on the scoped GITHUB_TOKEN with least-privilege
# permissions (below) and SHA-pinned actions. To move to a newer Upptime
# version, follow the manual-update steps in the PR / runbook.
#
# 🔼 Upptime @v1.42.6 — https://upptime.js.org · by Anand Chowdhary

name: Static Site CI
on:
  push:
    paths:
      - "assets/**"
  schedule:
    - cron: "0 1 * * *"
  repository_dispatch:
    types: [static_site]
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
permissions:
  contents: write # uptime-monitor 'site' reads repo data (can tighten to read after a validated run)
  pages: write # deploy via the first-party GitHub Pages API
  id-token: write # OIDC token required by actions/deploy-pages
jobs:
  release:
    name: Build and deploy site
    runs-on: ubuntu-latest
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    steps:
      - name: Checkout
        uses: actions/checkout@df4cb1c069e1874edd31b4311f1884172cec0e10 # v6
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ github.token }}
      - name: Generate site
        uses: upptime/uptime-monitor@940c360e6ee3b3f43b234e56a79e15c76a0c6c2e # v1.42.6
        with:
          command: "site"
        env:
          GH_PAT: ${{ github.token }}
      # SEC-49: replaced peaceiris/actions-gh-pages (non-verified creator) with
      # the first-party GitHub Pages actions so this repo passes the
      # verified-creator org policy. Requires the repo Pages source to be set to
      # "GitHub Actions" (see PR checklist) instead of the gh-pages branch.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@56afc609e74202658d3ffba0e8f6dda462b719fa # v3
        with:
          path: "site/status-page/__sapper__/export/"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@d6db90164ac5ed86f2b6aed7e0febac5b3c0c03e # v4
