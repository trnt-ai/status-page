#
# ===============================
# SEC-44: de-templated — safe to edit
# ===============================
#
# Upstream Upptime auto-regeneration (update-template / updates / setup) was
# removed for SEC-44, so this file is no longer overwritten. It is now
# maintained by hand: it runs on the scoped GITHUB_TOKEN with least-privilege
# permissions (below) and SHA-pinned actions. To move to a newer Upptime
# version, follow the manual-update steps in the PR / runbook.
#
# 🔼 Upptime @v1.42.6 — https://upptime.js.org · by Anand Chowdhary

name: Static Site CI
on:
  push:
    paths:
      - "assets/**"
  schedule:
    - cron: "0 1 * * *"
  repository_dispatch:
    types: [static_site]
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
# Least-privilege for the GitHub-native Pages deploy (replaces the gh-pages push).
# The uptime-monitor "site" command only reads repo history to build the export;
# pages:write + id-token:write are for actions/deploy-pages (OIDC).
permissions:
  contents: read
  pages: write
  id-token: write
jobs:
  release:
    name: Build and deploy site
    runs-on: ubuntu-latest
    if: "!contains(github.event.head_commit.message, '[skip ci]')"
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    steps:
      - name: Checkout
        uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ github.token }}
      - name: Generate site
        uses: upptime/uptime-monitor@2eb5d99848b4be6e474f26112cf29e5cd5ab313c # v1.43.15
        with:
          command: "site"
        env:
          GH_PAT: ${{ github.token }}
      # Preserve the custom domain across the switch to GitHub-native Pages.
      - name: Add CNAME for custom domain
        run: echo "status.trent.ai" > site/status-page/__sapper__/export/CNAME
      # Replaces the non-verified peaceiris/actions-gh-pages with GitHub-owned
      # Pages actions — a scoped pages:write deployment token instead of a
      # contents:write push to gh-pages.
      - name: Upload Pages artifact
        uses: actions/upload-pages-artifact@fc324d3547104276b827a68afc52ff2a11cc49c9 # v5.0.0
        with:
          path: "site/status-page/__sapper__/export/"
      - name: Deploy to GitHub Pages
        id: deployment
        uses: actions/deploy-pages@cd2ce8fcbc39b97be8ca5fce6e763baed58fa128 # v5.0.0
