#
# ===============================
# SEC-44: de-templated — safe to edit
# ===============================
#
# Upstream Upptime auto-regeneration (update-template / updates / setup) was
# removed for SEC-44, so this file is no longer overwritten. It is now
# maintained by hand: it runs on the scoped GITHUB_TOKEN with least-privilege
# permissions (below) and SHA-pinned actions. To move to a newer Upptime
# version, follow the manual-update steps in the PR / runbook.
#
# 🔼 Upptime @v1.42.6 — https://upptime.js.org · by Anand Chowdhary

name: Uptime CI
on:
  schedule:
    - cron: "*/5 * * * *"
  repository_dispatch:
    types: [uptime]
  workflow_dispatch:
concurrency:
  group: ${{ github.repository }}-${{ github.head_ref || github.ref_name }}-upptime
  cancel-in-progress: false
permissions:
  contents: write # commit uptime history / api data
  issues: write # open/close incident issues on down/up
jobs:
  release:
    name: Check status
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          ref: ${{ github.head_ref || github.ref_name }}
          token: ${{ github.token }}
      - name: Check endpoint status
        uses: upptime/uptime-monitor@176831d39d1e5eb6f52a76894ccf4fad51463d33 # v1.43.0
        with:
          command: "update"
        env:
          GH_PAT: ${{ github.token }}
          SECRETS_CONTEXT: ${{ toJson(secrets) }}
